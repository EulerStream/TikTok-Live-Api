openapi: 3.0.0
info:
  contact:
    name: Euler Stream
  description: Sign Server API Documentation
  license:
    name: All Rights Reserved
  title: Euler Stream Sign API
  version: dev
servers:
- description: Public Server (Community & Pro)
  url: https://api.eulerstream.com
- description: Enterprise Server (Enterprise)
  url: https://tiktok.enterprise.eulerstream.com
- description: Staging Server (Private Use)
  url: https://api.staging.eulerstream.com
tags:
- description: Fetch information from the TikTok LIVE Webcast API.
  name: TikTok LIVE
- description: Fetch information about a TikTok LIVE room by its room ID.
  name: TikTok LIVE Rooms
- description: Fetch information about a TikTok LIVE anchor (host) by their unique
    ID.
  name: TikTok LIVE Anchors
- description: Fetch the TikTok LIVE gift catalog and individual gift details.
  name: TikTok LIVE Gifts
- description: Premium TikTok LIVE routes for stream moderation.
  name: TikTok LIVE Moderation
- description: Current & historical TikTok LIVE Leaderboards & analytics.
  name: TikTok LIVE Rankings
- description: Browse & look up the TikTok LIVE agency catalog.
  name: TikTok LIVE Agencies
- description: Public TikTok API signing routes.
  name: TikTok General
- description: "Manage, create, update, and retrieve information about TikTok LIVE\
    \ Creator Alerts."
  name: TikTok LIVE Alerts
- description: "Manage, create, update, and retrieve information about TikTok LIVE\
    \ Creator Alert Targets."
  name: TikTok LIVE Alert Targets
- description: Routes related to TikTok Captchas.
  name: TikTok Captchas
- description: "Manage, create, update, and retrieve information about Sign API Accounts."
  name: Accounts
- description: "Manage, create, update, and retrieve information about Sign API keys."
  name: Authentication
- description: Routes for Sign API analytics and logging.
  name: Analytics
- description: Manage WebSocket connections and state.
  name: TikTok WebSocket API
paths:
  /accounts/me:
    get:
      description: Retrieve an account from the Sign API
      operationId: RetrieveAccountSelf
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Accounts
  /accounts/me/rate_limits:
    get:
      description: Retrieve the rate limits for the provided API key (or the unauthenticated
        limits if no key is provided)
      operationId: GetRateLimits
      parameters:
      - description: Which set of rate limits to retrieve. Defaults to the webcast
          (account) limits.
        explode: true
        in: query
        name: type
        required: false
        schema:
          $ref: "#/components/schemas/RateLimitType"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRateLimits"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Accounts
  /accounts/{account_id}/jwt/create:
    post:
      description: Create a JWT for a given API key. Note that these JWT keys are
        only valid for the non-authenticated Webcast endpoints. They function to attach
        the rate limits of the API key to the request for client-sided applications.
      operationId: CreateJWT
      parameters:
      - description: The ID of the account to create the JWT for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJWT_request"
        description: The configuration for the JWT
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateJWTResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Authentication
      x-docs-group: JWT
  /accounts/{account_id}/api_keys/create:
    put:
      description: Create a new API key
      operationId: CreateKey
      parameters:
      - description: The ID of the account to create the key for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyPayload"
        description: The configuration for the new key
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Authentication
      x-docs-group: API Keys
  /accounts/{account_id}/api_keys/delete:
    delete:
      description: "Delete an API key by its key value, name, or ID"
      operationId: DeleteKey
      parameters:
      - description: The ID of the account to delete the key for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The API key field to delete by
        explode: true
        in: query
        name: delete_by
        required: true
        schema:
          enum:
          - value
          - id
          type: string
        style: form
      - description: The API key field value to delete by
        explode: true
        in: query
        name: delete_param
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteKeyResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Authentication
      x-docs-group: API Keys
  /accounts/{account_id}/api_keys/list:
    get:
      description: "Retrieve an API key by its key value, name, or ID"
      operationId: ListKeys
      parameters:
      - description: The ID of the account to retrieve the key for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListKeysResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Authentication
      x-docs-group: API Keys
  /accounts/{account_id}/api_keys/retrieve:
    get:
      description: "Retrieve an API key by its key value, name, or ID"
      operationId: GetKey
      parameters:
      - description: The ID of the account to retrieve the key for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The API key field to retrieve by
        explode: true
        in: query
        name: retrieve_by
        required: false
        schema:
          default: value
          enum:
          - value
          - id
          type: string
        style: form
      - description: The API key field value to retrieve by
        explode: true
        in: query
        name: retrieve_param
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveKeyResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Authentication
      x-docs-group: API Keys
  /accounts/{account_id}/api_keys/update:
    patch:
      description: Update an existing API key
      operationId: UpdateKey
      parameters:
      - description: The account to update the key for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The API key field to update by
        explode: true
        in: query
        name: update_by
        required: true
        schema:
          enum:
          - value
          - id
          type: string
        style: form
      - description: The API key field value to update by
        explode: true
        in: query
        name: update_param
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeyPayload"
        description: The new configuration for the key
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateKeyResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
      tags:
      - Authentication
      x-docs-group: API Keys
  /accounts/{account_id}/alerts/create:
    put:
      description: Create a creator alert. These Alerts are used to notify users of
        a new livestream.
      operationId: CreateAlert
      parameters:
      - description: The ID of the account to create the alert for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlert_request"
        description: Configuration for the alert
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAlertResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alerts
  /accounts/{account_id}/alerts/{alert_id}/delete:
    delete:
      description: Delete an alert from the Sign API
      operationId: DeleteAlert
      parameters:
      - description: The ID of the account to delete the alert from
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The ID of the alert to delete
        explode: false
        in: path
        name: alert_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAlertResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alerts
  /accounts/{account_id}/alerts/list:
    get:
      operationId: ListAlerts
      parameters:
      - explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: double
          type: number
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAlertsResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alerts
  /accounts/{account_id}/alerts/{alert_id}/retrieve:
    get:
      description: Retrieve a specific alert by its ID
      operationId: RetrieveAlert
      parameters:
      - description: The account that the alert belongs to
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The ID of the alert to retrieve
        explode: false
        in: path
        name: alert_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAlertResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alerts
  /accounts/{account_id}/alerts/{alert_id}/targets/create:
    put:
      description: Create a target for an alert. This is the HTTP endpoint that will
        be called when an alert is triggered.
      operationId: CreateAlertTarget
      parameters:
      - description: The ID of the account to create the alert target for
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The ID of the alert to create the target for
        explode: false
        in: path
        name: alert_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertTargetPayload"
        description: Configuration for the alert target
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAlertTargetResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alert Targets
  /accounts/{account_id}/alerts/{alert_id}/targets/{target_id}/delete:
    delete:
      description: Delete an alert target from the Sign API
      operationId: DeleteAlertTarget
      parameters:
      - description: The ID of the account to delete the alert target from
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The ID of the alert to delete the target from
        explode: false
        in: path
        name: alert_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The ID of the target to delete
        explode: false
        in: path
        name: target_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAlertTargetResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alert Targets
  /accounts/{account_id}/alerts/{alert_id}/targets/list:
    get:
      description: List all alert targets for a specific alert
      operationId: ListAlertTargets
      parameters:
      - description: The account that the alert belongs to
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The alert to list targets for
        explode: false
        in: path
        name: alert_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAlertTargetsResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alert Targets
  /accounts/{account_id}/alerts/{alert_id}/targets/{target_id}/test:
    post:
      description: Test an alert target
      operationId: TestAlertTarget
      parameters:
      - description: The account that the alert belongs to
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The alert that the target belongs to
        explode: false
        in: path
        name: alert_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      - description: The target to test
        explode: false
        in: path
        name: target_id
        required: true
        schema:
          format: double
          type: number
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAlertTargetResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - PUBLIC
        api_key_header:
        - PUBLIC
        jwt_key_header:
        - PUBLIC
      tags:
      - TikTok LIVE Alert Targets
  /analytics/agents:
    get:
      description: Retrieve the currently connected agents
      operationId: FetchAgents
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAgentHostsResponse"
          description: All registered agents
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security: []
      tags:
      - Analytics
  /analytics/hosts:
    get:
      description: Retrieve the list of API hosts (used for horizontal scaling)
      operationId: GetHosts
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostsResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security: []
      tags:
      - Analytics
  /analytics/pips:
    get:
      description: Retrieve stats as an SVG
      operationId: Pips
      parameters:
      - description: Specify label colour in SVG
        explode: true
        in: query
        name: labelColour
        required: false
        schema:
          default: "#555"
          type: string
        style: form
      - description: Specify value colour in SVG
        explode: true
        in: query
        name: valueColour
        required: false
        schema:
          default: "#007ec6"
          type: string
        style: form
      - description: The number of hours to retrieve the stat for
        explode: true
        in: query
        name: hours
        required: false
        schema:
          default: 1
          format: double
          type: number
        style: form
      - description: The client to filter for
        explode: true
        in: query
        name: client
        required: false
        schema:
          $ref: "#/components/schemas/TikTokSignLiveClient"
        style: form
      - description: Add the ability to retrieve the pip as JSON
        explode: true
        in: query
        name: json
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pips_200_response"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security: []
      tags:
      - Analytics
  /tiktok/captchas/icons:
    post:
      description: |-
        The icons captcha requires just one image & a prompt string.

        ## Example Image
        <img src="https://www.eulerstream.com/_static/captchas/icon.png" alt="Icons Captcha Example" width="480" />

        ## Usage

        The `prompt` is the text prompt provided by TikTok. The Icon captcha solution is provided as a list of points, where each point marks a location on the image that needs to be clicked.
        These points are expressed as ratios relative to the image's width and height.
        A point of (0.0, 0.0) corresponds to the image’s upper-left corner, while (1.0, 1.0) represents the lower-right corner. For reference, (0.5, 0.5) sits at the exact center.

        The captcha image selector is `.captcha-verify-image`
      operationId: CompleteIconCaptcha
      parameters:
      - description: The prompt string provided by TikTok
        explode: true
        in: query
        name: prompt
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CompleteIconCaptcha_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconCaptchaResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - CAPTCHAS
        api_key_header:
        - CAPTCHAS
        license_key_query:
        - CAPTCHAS
      tags:
      - TikTok Captchas
  /tiktok/captchas/puzzle:
    post:
      description: |-
        The puzzle captcha requires two images

        ## Example Image
        <img src="https://www.eulerstream.com/_static/captchas/puzzle.png" alt="Puzzle Piece Example" width="480" />

        ## Usage

        The solution to the puzzle captcha is the distance to move the slider to fit the puzzle piece into the background.

        The `backgroundImage` is the full background image with the missing piece.
        The `pieceImage` is the small puzzle piece that needs to be fit into the background.

        The captcha image selectors are:
        - Background: `.captcha-verify-image`
        - Piece: `#captcha-verify-image ~ div.cap-absolute > img`

        The solution is the `x` proportion (0-1) of the width of the background image where the piece fits. It is 1:1 with the slider distance proportion.
      operationId: CompletePuzzleCaptcha
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CompletePuzzleCaptcha_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuzzleCaptchaResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - CAPTCHAS
        api_key_header:
        - CAPTCHAS
        license_key_query:
        - CAPTCHAS
      tags:
      - TikTok Captchas
  /tiktok/captchas/shapes:
    post:
      description: |-
        The shapes captcha requires just one image.

        ## Example Image
        <img src="https://www.eulerstream.com/_static/captchas/threed.png" alt="Shapes Captcha Example" width="480" />

        ## Usage

        The solution to the shapes captcha are two points that need to be clicked. To use it in the GUI, convert the proportions to pixel values based on the image size.

        The `points` are returned as `x` and `y` proportions (0-1) of the width and height of the source image.
        The captcha image selector is `.captcha-verify-image`
      operationId: CompleteShapesCaptcha
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CompleteShapesCaptcha_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapesCaptchaResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - CAPTCHAS
        api_key_header:
        - CAPTCHAS
        license_key_query:
        - CAPTCHAS
      tags:
      - TikTok Captchas
  /tiktok/captchas/whirl:
    post:
      description: |-
        The whirl captcha requires two images: the outer image and the inner image.

        ## Example Image
        <img src="https://www.eulerstream.com/_static/captchas/rotate.png" alt="Whirl Captcha Example" width="480" />

        ## Usage

        The solution to the whirl captcha is an angle from 0-360. To use it in the GUI, it must be converted to a slider distance:

        `px = ((sidebar_length - icon_length) * angle) / 360`

        - `sidebar_length` is the width of `.captcha_verify_slide--slidebar`
        - `icon_length` is the width of `.secsdk-captcha-drag-icon`
      operationId: CompleteWhirlCaptcha
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CompleteWhirlCaptcha_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhirlCaptchaResponse"
          description: Ok
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_429_response"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveAccountSelf_500_response"
          description: Internal Server Error
      security:
      - api_key_query:
        - CAPTCHAS
        api_key_header:
        - CAPTCHAS
        license_key_query:
        - CAPTCHAS
      tags:
      - TikTok Captchas
