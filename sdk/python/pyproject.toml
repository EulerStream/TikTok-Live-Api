[tool.poetry]
name = "EulerApiSdk"
version = "0.4.0"
description = "TikTok LIVE API SDK for Python. Real-time TikTok LIVE chat, gifts, likes, follows, viewer counts and PK battles via the EulerStream managed TikTok LIVE API, with typed clients for webcast signing, rooms, gifts, rankings, LIVE alerts, moderation, captchas and analytics."
authors = ["EulerStream"]
license = "MIT"
readme = "README.md"
homepage = "https://www.eulerstream.com"
repository = "https://github.com/EulerStream/TikTok-Live-Api"
documentation = "https://www.eulerstream.com/docs/intro"
keywords = [
    "tiktok",
    "tiktok live",
    "tiktok-live",
    "tiktoklive",
    "tiktok live api",
    "tiktok api",
    "tiktok live sdk",
    "tiktok live chat",
    "tiktok live gifts",
    "tiktok live stream",
    "tiktok webcast",
    "tiktok live events",
    "tiktok live alerts",
    "tiktok live moderation",
    "tiktok signing",
    "eulerstream",
    "euler stream",
    "livestream",
    "websocket",
    "webcast",
    "api",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
packages = [
    { include = "EulerApiSdk" },
]
include = ["EulerApiSdk/py.typed"]

[tool.poetry.urls]
"Homepage" = "https://www.eulerstream.com"
"Documentation" = "https://www.eulerstream.com/docs/intro"
"OpenAPI Reference" = "https://www.eulerstream.com/docs/openapi"
"Pricing" = "https://www.eulerstream.com/pricing"
"Discord" = "https://www.eulerstream.com/discord"
"Repository" = "https://github.com/EulerStream/TikTok-Live-Api"
"Issues" = "https://github.com/EulerStream/TikTok-Live-Api/issues"

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
