boilerplate:
  showImports: true

variables:
  # The snippets cover every operation, so they import the general package:
  # tiktok-live-api-sdk only has the TikTok LIVE groups.
  sdkImport: "from TikTokApiSdk.client import AuthenticatedClient"
  sdkPackage: TikTokApiSdk
  clientConstruction: |
    client = AuthenticatedClient(
        base_url="$baseUrl",
        token="$apiKey",
    )
  clientVar: client

templatePath: ./python-wrapper.mustache

outputFormats:
  - md
  - json

apiClassMap:
  "TikTok LIVE": tik_tok_live
  "TikTok LIVE Premium": tik_tok_live_premium
  "TikTok LIVE Moderation": tik_tok_live_moderation
  "TikTok General": tik_tok_general
  "TikTok Captchas": tik_tok_captchas
  Analytics: analytics
  "TikTok LIVE Alerts": tik_tok_live_alerts
  "TikTok LIVE Alert Targets": tik_tok_live_alert_targets
  Accounts: accounts
  Authentication: authentication

paramOverrides:
  global:
    account_id: $accountId

excludeParams:
  - x-cookie-header
