boilerplate:
  showImports: true

variables:
  # The snippets cover every operation, so they import the general package:
  # tiktok-live-api-sdk only has the TikTok LIVE groups.
  sdkImport: "import TikTokApiSdk from 'tiktok-api-sdk'"
  clientConstruction: "const client = new TikTokApiSdk({ apiKey: '$apiKey', basePath: '$baseUrl' });"
  clientVar: client
  apiAccessPattern: dot

templatePath: ./wrapper.mustache

outputFormats:
  - md
  - json

apiClassMap:
  "TikTok LIVE": webcast
  "TikTok LIVE Premium": premium
  "TikTok LIVE Moderation": moderation
  "TikTok General": general
  "TikTok Captchas": captchas
  Analytics: analytics
  "TikTok LIVE Alerts": alerts
  "TikTok LIVE Alert Targets": alertTargets
  Accounts: accounts
  Authentication: authentication

paramOverrides:
  global:
    account_id: $accountId

excludeParams:
  - x-cookie-header
