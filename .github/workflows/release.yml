name: "Release: Generate & Publish SDKs"

on:
  workflow_dispatch:
    inputs:
      typescript_bump:
        description: 'TypeScript version bump — skip to not publish'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
        default: skip
      python_bump:
        description: 'Python version bump — skip to not publish'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
        default: skip
      csharp_bump:
        description: 'C# version bump — skip to not publish'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
        default: skip
      java_bump:
        description: 'Java version bump — skip to not publish'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
        default: skip
      go_bump:
        description: 'Go version bump — skip to not publish'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
        default: skip
      python_legacy_final:
        description: 'One-off: also publish the final EulerApiSdk release (moved notice)'
        type: boolean
        default: false
      packages:
        description: 'TypeScript/Python packages to release — both, only the full API package (api), or only the TikTok LIVE package (live)'
        type: choice
        options:
          - both
          - api
          - live
        default: both
      upload_examples:
        description: 'Sync the generated docs snippets to the website CDN'
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Release must be triggered from the master branch, got ${{ github.ref }}"
          exit 1

  # TypeScript and Python each publish two packages: the TikTok LIVE package (live)
  # and the full API package (api). Each package has its own version, kept in
  # sdk/<language>/<package>/version.txt. A language's bump input moves every
  # package of that language being released; the `packages` input narrows a
  # release to one of them. The next versions are worked out once here and used
  # by the publish legs and by commit-versions.
  versions:
    needs: check-branch
    runs-on: ubuntu-latest
    outputs:
      typescript_live: ${{ steps.next.outputs.typescript_live }}
      typescript_api: ${{ steps.next.outputs.typescript_api }}
      python_live: ${{ steps.next.outputs.python_live }}
      python_api: ${{ steps.next.outputs.python_api }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute next versions
        id: next
        env:
          TYPESCRIPT_BUMP: ${{ inputs.typescript_bump }}
          PYTHON_BUMP: ${{ inputs.python_bump }}
        run: |
          for language in typescript python; do
            if [ "$language" = "typescript" ]; then bump="$TYPESCRIPT_BUMP"; else bump="$PYTHON_BUMP"; fi
            if [ "$bump" = "skip" ]; then continue; fi
            for package in live api; do
              current=$(tr -d ' \n' < "sdk/$language/$package/version.txt")
              next=$(python3 .github/scripts/next_version.py "$current" "$bump")
              echo "${language}_${package}=$next" >> "$GITHUB_OUTPUT"
              echo "$language/$package: $current → $next"
            done
          done

  generate:
    needs: check-branch
    uses: ./.github/workflows/sdk-generate.yml
    with:
      typescript: ${{ inputs.typescript_bump != 'skip' }}
      python: ${{ inputs.python_bump != 'skip' }}
      python_legacy: ${{ inputs.python_legacy_final }}
      packages: ${{ inputs.packages }}
      upload_examples: ${{ inputs.upload_examples }}
      csharp: ${{ inputs.csharp_bump != 'skip' }}
      java: ${{ inputs.java_bump != 'skip' }}
      go: ${{ inputs.go_bump != 'skip' }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # ── TypeScript → npm ──────────────────────────────────────────

  # One leg per package: the TikTok LIVE package (live) and the full API package (api).
  # npm trusted publishing is configured per package on npmjs.com, each naming
  # this repository and this workflow file.
  publish-typescript:
    needs: [generate, versions]
    if: ${{ inputs.typescript_bump != 'skip' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages == 'both' && '["live","api"]' || format('["{0}"]', inputs.packages)) }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.versions.outputs[format('typescript_{0}', matrix.package)] }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-typescript-${{ matrix.package }}
          path: sdk/typescript/${{ matrix.package }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      - name: Set version
        working-directory: sdk/typescript/${{ matrix.package }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # If one leg failed last time, this language's version files were not
      # committed, so a new dispatch computes the same versions again. The
      # package that already made it to the registry is skipped and the other
      # one catches up.
      #
      # When retrying, re-dispatch ONLY the language that failed and set every
      # other bump to `skip`. A language whose packages all published has had
      # its version files committed, so repeating its bump would release it a
      # second time at the next version.
      - name: Publish to npm
        working-directory: sdk/typescript/${{ matrix.package }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public

  # ── Python → PyPI ─────────────────────────────────────────────

  # One leg per package: the TikTok LIVE package (live) and the full API package (api).
  # Both publish through PyPI trusted publishing: the job's OIDC token is
  # exchanged for a short-lived upload token, so no PyPI secret is involved.
  # Each project on PyPI must list this repository and this workflow file as a
  # trusted publisher (a "pending publisher" before the project's first upload).
  publish-python:
    needs: [generate, versions]
    if: ${{ inputs.python_bump != 'skip' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages == 'both' && '["live","api"]' || format('["{0}"]', inputs.packages)) }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.versions.outputs[format('python_{0}', matrix.package)] }}
    steps:
      # The checkout provides sdk/python/common (check_dist.py); the artifact
      # then lays the generated package over its folder.
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-python-${{ matrix.package }}
          path: sdk/python/${{ matrix.package }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poetry
        run: pip install poetry

      - name: Set version
        working-directory: sdk/python/${{ matrix.package }}
        run: poetry version "$VERSION"

      # Build, then open the wheel and sdist to make sure the code is in them
      # before anything is uploaded.
      - name: Build
        working-directory: sdk/python/${{ matrix.package }}
        run: |
          rm -rf dist
          poetry build
          python3 ../common/scripts/check_dist.py

      # skip-existing: see the note on publish-typescript for why a version that
      # is already on the registry is skipped rather than treated as an error.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/${{ matrix.package }}/dist
          skip-existing: true

  # One-off: the final release of the retired EulerApiSdk package, at the version
  # fixed in sdk/python/legacy/sdk.json. Remove this job, the input and
  # sdk/python/legacy once it has shipped.
  publish-python-legacy:
    needs: generate
    if: ${{ inputs.python_legacy_final }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-python-legacy
          path: sdk/python/legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poetry
        run: pip install poetry

      - name: Publish to PyPI
        working-directory: sdk/python/legacy
        run: |
          NAME=$(poetry version | cut -d' ' -f1)
          VERSION=$(poetry version -s)
          if curl -fsS -o /dev/null "https://pypi.org/pypi/$NAME/$VERSION/json" 2>/dev/null; then
            echo "::notice::$NAME $VERSION is already published; skipping."
            exit 0
          fi
          rm -rf dist
          poetry build
          python3 ../common/scripts/check_dist.py
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
          poetry publish --no-interaction

  # ── C# → NuGet ───────────────────────────────────────────────

  publish-csharp:
    needs: generate
    if: ${{ inputs.csharp_bump != 'skip' }}
    runs-on: ubuntu-latest
    # NuGet trusted publishing: the job's OIDC token is exchanged for a short-lived
    # API key by NuGet/login, so no long-lived NUGET_TOKEN secret exists to expire.
    # nuget.org must list this repo + workflow as a trusted publisher of the package
    # under the account named in NUGET_USER (repository variable).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-csharp
          path: sdk/csharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Bump version
        working-directory: sdk/csharp/src
        run: |
          CURRENT=$(grep '<Version>' EulerApiSdk.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case "${{ inputs.csharp_bump }}" in
            patch) PAT=$((PAT+1)) ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
          esac
          NEXT="$MAJ.$MIN.$PAT"
          sed -i "s|<Version>$CURRENT</Version>|<Version>$NEXT</Version>|" EulerApiSdk.csproj
          echo "Bumped C# version: $CURRENT → $NEXT"

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Pack & publish to NuGet
        working-directory: sdk/csharp/src
        run: |
          dotnet pack -c Release --no-build -o ./nupkg || dotnet pack -c Release -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Upload version file
        uses: actions/upload-artifact@v4
        with:
          name: csharp-version
          path: sdk/csharp/src/EulerApiSdk.csproj

  # ── Java → Maven Central ─────────────────────────────────────

  publish-java:
    needs: generate
    if: ${{ inputs.java_bump != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-java
          path: sdk/java

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # The ubuntu-24.04 runner image (20261012+) ships Maven 3.10.0, under which
      # central-publishing-maven-plugin 0.11.0 leaves maven-metadata-local.xml and
      # _remote.repositories in the Central bundle; the Portal then rejects the
      # deployment with "Bundle has content that does NOT have a .pom file". Pin
      # the last 3.9 release until the plugin strips those files (upstream PR #80).
      - name: Pin Maven 3.9.16
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-3.9.16/bin/mvn" -v

      - name: Bump version
        working-directory: sdk/java
        run: |
          CURRENT=$(tr -d ' \n' < version.txt)
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case "${{ inputs.java_bump }}" in
            patch) PAT=$((PAT+1)) ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
          esac
          NEXT="$MAJ.$MIN.$PAT"
          echo "$NEXT" > version.txt
          (cd src/generated && mvn -B -q versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false)
          echo "Bumped Java version: $CURRENT → $NEXT"

      - name: Publish to Maven Central
        working-directory: sdk/java/src/generated
        run: mvn -B deploy -Psign-artifacts -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Upload version file
        uses: actions/upload-artifact@v4
        with:
          name: java-version
          path: sdk/java/version.txt

  # ── Go → git tag ─────────────────────────────────────────────

  publish-go:
    needs: generate
    if: ${{ inputs.go_bump != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next Go version tag
        id: version
        run: |
          LATEST=$(git tag --list 'sdk/go/v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            CURRENT="0.0.0"
          else
            CURRENT="${LATEST#sdk/go/v}"
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case "${{ inputs.go_bump }}" in
            patch) PAT=$((PAT+1)) ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
          esac
          NEXT="$MAJ.$MIN.$PAT"
          echo "tag=sdk/go/v$NEXT" >> $GITHUB_OUTPUT
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "Go version: $CURRENT → $NEXT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Index on Go module proxy
        run: GOPROXY=proxy.golang.org go list -m github.com/EulerStream/TikTok-Live-Api/sdk/go@v${{ steps.version.outputs.version }}

  # ── Commit version bumps back ─────────────────────────────────

  commit-versions:
    needs: [generate, versions, publish-typescript, publish-python, publish-csharp, publish-java, publish-go]
    if: |
      always() && (
        needs.publish-typescript.result == 'success' ||
        needs.publish-python.result == 'success' ||
        needs.publish-csharp.result == 'success' ||
        needs.publish-java.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A matrix job succeeds only when every package it was asked to release
      # published (or was already published), so a language's version files move
      # only once all of its released packages are at their new versions.
      - name: Record TypeScript and Python versions
        id: recorded
        env:
          PACKAGES: ${{ inputs.packages }}
          TYPESCRIPT_RESULT: ${{ needs.publish-typescript.result }}
          PYTHON_RESULT: ${{ needs.publish-python.result }}
          TYPESCRIPT_LIVE: ${{ needs.versions.outputs.typescript_live }}
          TYPESCRIPT_API: ${{ needs.versions.outputs.typescript_api }}
          PYTHON_LIVE: ${{ needs.versions.outputs.python_live }}
          PYTHON_API: ${{ needs.versions.outputs.python_api }}
        run: |
          PARTS=""
          record() {
            # record <language> <package> <version>
            echo "$3" > "sdk/$1/$2/version.txt"
            if [ -n "$PARTS" ]; then PARTS="${PARTS}, "; fi
            PARTS="${PARTS}$1-$2@$3"
          }
          released() {
            # released <package>: was this package part of the release?
            [ "$PACKAGES" = "both" ] || [ "$PACKAGES" = "$1" ]
          }
          if [ "$TYPESCRIPT_RESULT" = "success" ]; then
            if released live; then record typescript live "$TYPESCRIPT_LIVE"; fi
            if released api; then record typescript api "$TYPESCRIPT_API"; fi
          fi
          if [ "$PYTHON_RESULT" = "success" ]; then
            if released live; then record python live "$PYTHON_LIVE"; fi
            if released api; then record python api "$PYTHON_API"; fi
          fi
          echo "parts=$PARTS" >> "$GITHUB_OUTPUT"

      - name: Download C# version
        if: needs.publish-csharp.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: csharp-version
          path: sdk/csharp/src

      - name: Download Java version
        if: needs.publish-java.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: java-version
          path: sdk/java

      - name: Download SDK examples output
        uses: actions/download-artifact@v4
        with:
          name: sdk-examples-output
          path: sdk-examples/output
        continue-on-error: true

      - name: Build commit message
        id: msg
        run: |
          PARTS="${{ steps.recorded.outputs.parts }}"
          if [ "${{ needs.publish-csharp.result }}" = "success" ]; then
            CS=$(grep '<Version>' sdk/csharp/src/EulerApiSdk.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
            [ -n "$PARTS" ] && PARTS="${PARTS}, "
            PARTS="${PARTS}csharp@${CS}"
          fi
          if [ "${{ needs.publish-java.result }}" = "success" ]; then
            JV=$(tr -d ' \n' < sdk/java/version.txt)
            [ -n "$PARTS" ] && PARTS="${PARTS}, "
            PARTS="${PARTS}java@${JV}"
          fi
          echo "msg=chore: release ${PARTS} [skip ci]" >> $GITHUB_OUTPUT

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/typescript/live/version.txt sdk/typescript/api/version.txt sdk/python/live/version.txt sdk/python/api/version.txt sdk/csharp/src/EulerApiSdk.csproj sdk/java/version.txt 2>/dev/null || true
          git add sdk-examples/output/*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "${{ steps.msg.outputs.msg }}"
          git push
