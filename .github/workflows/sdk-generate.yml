name: Generate SDKs

on:
  workflow_call:
    inputs:
      typescript:
        type: boolean
        default: false
      python:
        type: boolean
        default: false
      # One-off: also build the final EulerApiSdk release (sdk/python/legacy).
      python_legacy:
        type: boolean
        default: false
      # Which TypeScript/Python packages to build: `both`, or only `live`
      # (tiktok-live-api-sdk) or `api` (tiktok-api-sdk).
      packages:
        type: string
        default: both
      # Sync the generated docs snippets to the website's CDN. Turn off for a run
      # that must not change what the website shows.
      upload_examples:
        type: boolean
        default: true
      csharp:
        type: boolean
        default: false
      java:
        type: boolean
        default: false
      go:
        type: boolean
        default: false
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # TypeScript and Python are each published as two packages built from the same
  # spec: tiktok-live-api-sdk (`live`, the TikTok LIVE groups only) and
  # tiktok-api-sdk (`api`, everything). Each package folder has an sdk.json, and
  # one generate script per language turns it into a package: it copies and
  # normalizes the spec, cuts it down to the package's tags (spec/packages.json)
  # when the package asks for that, runs the generator, and adds the shared
  # hand-written sources from sdk/<language>/common.

  generate-typescript:
    if: ${{ inputs.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages == 'both' && '["live","api"]' || format('["{0}"]', inputs.packages)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate
        working-directory: sdk/typescript/${{ matrix.package }}
        run: pnpm run generate

      - name: Build
        working-directory: sdk/typescript/${{ matrix.package }}
        run: pnpm run build

      # After the build: the alias test checks the built declarations in dist/.
      - name: Test
        working-directory: sdk/typescript/${{ matrix.package }}
        run: pnpm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-typescript-${{ matrix.package }}
          path: sdk/typescript/${{ matrix.package }}

  generate-python:
    if: ${{ inputs.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages == 'both' && '["live","api"]' || format('["{0}"]', inputs.packages)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # requirements.txt pins openapi-python-client: the generator's template
      # variables changed between minors (0.29 wraps them in UntrustedString and
      # needs the in_double_quote_literal filter), and the custom templates in
      # sdk/python/common/templates and each package's templates/ target 0.29.1.
      - name: Install tools
        run: pip install -r sdk/python/requirements.txt

      # Also writes the test manifest and pins the version from the package's
      # version.txt (the generator resets it to a placeholder).
      - name: Generate
        working-directory: sdk/python/${{ matrix.package }}
        run: python3 ../common/scripts/generate.py

      # The generated sources are git-ignored, and Poetry drops VCS-ignored files
      # unless pyproject.toml includes them. check_dist.py opens the built wheel
      # and sdist and fails if the code is not in them.
      - name: Build
        working-directory: sdk/python/${{ matrix.package }}
        run: |
          poetry build
          python3 ../common/scripts/check_dist.py

      - name: Test
        working-directory: sdk/python/${{ matrix.package }}
        run: |
          python3 test/test_basic.py
          python3 test/test_surface.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-python-${{ matrix.package }}
          path: sdk/python/${{ matrix.package }}

  # One-off: the final release of the retired EulerApiSdk package. Same code as
  # tiktok-api-sdk under the old name, with a README and an import warning that
  # say where it went. Remove this job with sdk/python/legacy once it has shipped.
  generate-python-legacy:
    if: ${{ inputs.python_legacy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install -r sdk/python/requirements.txt

      - name: Generate
        working-directory: sdk/python/legacy
        run: python3 ../common/scripts/generate.py

      - name: Build
        working-directory: sdk/python/legacy
        run: |
          poetry build
          python3 ../common/scripts/check_dist.py

      - name: Test
        working-directory: sdk/python/legacy
        run: python3 test/test_legacy.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-python-legacy
          path: sdk/python/legacy

  generate-csharp:
    if: ${{ inputs.csharp }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install root dependencies
        run: npm install -g pnpm && pnpm install

      - name: Copy spec & generate
        working-directory: sdk/csharp
        run: |
          mkdir -p build
          cp "$GITHUB_WORKSPACE/spec/openapi.json" ./build/openapi.json
          python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_spec.py" ./build/openapi.json
          rm -rf ./src/generated
          npx @openapitools/openapi-generator-cli generate \
            -i ./build/openapi.json -g csharp -o ./src/generated \
            --additional-properties=packageName=EulerApiSdk,targetFramework=net8.0,nullableReferenceTypes=true

      - name: Fix enum conflicts
        working-directory: sdk/csharp
        run: npx tsx ./scripts/fix-enum-conflicts.ts

      - name: Render client template
        working-directory: sdk/csharp
        run: npx tsx ./scripts/render-template.ts

      - name: Build
        working-directory: sdk/csharp/src
        run: dotnet build -c Release

      - name: Test
        working-directory: sdk/csharp/test
        run: dotnet test -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-csharp
          path: sdk/csharp

  generate-java:
    if: ${{ inputs.java }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install root dependencies
        run: npm install -g pnpm && pnpm install

      - name: Copy spec & generate
        working-directory: sdk/java
        run: |
          mkdir -p build
          cp "$GITHUB_WORKSPACE/spec/openapi.json" ./build/openapi.json
          python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_spec.py" ./build/openapi.json
          rm -rf ./src/generated
          npx @openapitools/openapi-generator-cli generate \
            -i ./build/openapi.json -g java -o ./src/generated \
            --additional-properties=groupId=com.eulerstream,artifactId=euler-api-sdk,apiPackage=com.eulerstream.api,modelPackage=com.eulerstream.model,invokerPackage=com.eulerstream

      - name: Render client template
        working-directory: sdk/java
        run: npx tsx ./scripts/render-template.ts

      - name: Patch pom for Maven Central (com.eulerstream)
        working-directory: sdk/java
        run: npx tsx ./scripts/fix-pom.ts

      - name: Build
        working-directory: sdk/java/src/generated
        run: mvn package -DskipTests

      - name: Test
        working-directory: sdk/java/src/generated
        run: mvn test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-java
          path: sdk/java

  generate-go:
    if: ${{ inputs.go }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install root dependencies
        run: npm install -g pnpm && pnpm install

      - name: Copy spec & generate
        working-directory: sdk/go
        run: |
          mkdir -p build
          cp "$GITHUB_WORKSPACE/spec/openapi.json" ./build/openapi.json
          python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_spec.py" ./build/openapi.json
          rm -rf ./generated
          npx @openapitools/openapi-generator-cli generate \
            -i ./build/openapi.json -g go -o ./generated \
            --additional-properties=packageName=eulerapi,moduleName=github.com/EulerStream/TikTok-Live-Api/sdk/go
          rm -f ./generated/go.mod ./generated/go.sum

      - name: Fix enum constant conflicts
        run: npx tsx ./sdk/go/scripts/fix-enum-conflicts.ts

      - name: Render client template
        run: npx tsx ./sdk/go/scripts/render-template.ts

      - name: Build
        working-directory: sdk/go
        run: go build ./...

      - name: Test
        working-directory: sdk/go
        run: go test ./... -v

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-go
          path: sdk/go

  generate-examples:
    if: always()
    needs: [generate-typescript, generate-python, generate-csharp, generate-java, generate-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Copy spec
        run: |
          mkdir -p build
          cp "$GITHUB_WORKSPACE/spec/openapi.json" ./build/openapi.json
          python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_spec.py" ./build/openapi.json

      - name: Generate examples
        working-directory: sdk-examples
        run: npx tsx generate.ts

      - name: Upload examples artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-examples-output
          path: sdk-examples/output/

      - name: Upload examples to R2
        if: ${{ inputs.upload_examples }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          pip install awscli
          aws s3 sync sdk-examples/output/ s3://eulerstream-web/sdk-examples/ \
            --endpoint-url https://f00699f0017e82344b8bed18c38dab38.r2.cloudflarestorage.com
