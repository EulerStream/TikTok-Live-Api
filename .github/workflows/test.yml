name: Test SDKs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # The spec filter, the version helper, the README guard and the Python build
  # check are plain scripts with their own tests; none needs a generated SDK.
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spec, release and README script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Python build check tests
        run: python3 sdk/python/common/test/test_check_dist.py -v

  # The generated TypeScript and Python code is not committed, so each package
  # is generated here before it is tested. That also runs the LIVE package
  # through the spec filter on every push.
  test-typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [live, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate
        working-directory: sdk/typescript/${{ matrix.package }}
        run: pnpm run generate

      - name: Build
        working-directory: sdk/typescript/${{ matrix.package }}
        run: pnpm run build

      - name: Run tests
        working-directory: sdk/typescript/${{ matrix.package }}
        run: |
          pnpm test
          pnpm run test:e2e

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [live, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r sdk/python/requirements.txt httpx attrs python-dateutil

      - name: Generate
        working-directory: sdk/python/${{ matrix.package }}
        run: python3 ../common/scripts/generate.py

      - name: Build
        working-directory: sdk/python/${{ matrix.package }}
        run: |
          poetry build
          python3 ../common/scripts/check_dist.py

      - name: Run tests
        working-directory: sdk/python/${{ matrix.package }}
        run: |
          python3 test/test_basic.py
          python3 test/test_surface.py
          python3 test/test_e2e.py

  test-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        working-directory: sdk/csharp/test
        run: dotnet test

  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run tests
        working-directory: sdk/java/src/generated
        run: mvn test

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install root dependencies
        run: npm install -g pnpm && pnpm install

      - name: Run fix script tests
        run: npx tsx sdk/go/test/fix-enum-conflicts.test.ts

      - name: Run SDK tests
        working-directory: sdk/go
        run: go test ./... -v
